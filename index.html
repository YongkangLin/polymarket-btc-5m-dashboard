<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BTC 5m Trading Workflow</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">BTC 5m Up/Down</p>
          <h1>Trading Workflow</h1>
        </div>
        <div class="status" id="statusText">Loading</div>
      </header>

      <nav class="tabs" aria-label="Workflow">
        <button class="tab is-active" type="button" data-tab="backtest">Back Test</button>
        <button class="tab" type="button" data-tab="paper">Paper Trade</button>
        <button class="tab" type="button" data-tab="live">Live Trade</button>
      </nav>

      <section class="panel is-active" id="backtestPanel" data-panel="backtest">
        <div class="toolbar">
          <label>
            <span>Market</span>
            <select id="backtestMarket"></select>
          </label>
          <label>
            <span>Metric</span>
            <select id="backtestMetric">
              <option value="trade_pnl">Trade PnL</option>
              <option value="distance_bps">BTC distance</option>
              <option value="signal_ask">Dominant-side ask</option>
              <option value="top5_capacity_dollars">Top-5 capacity</option>
            </select>
          </label>
        </div>
        <div class="chart" id="backtestChart"></div>
      </section>

      <section class="panel" id="paperPanel" data-panel="paper">
        <div class="toolbar">
          <label>
            <span>Gate</span>
            <select id="paperGate">
              <option value="backtest_to_paper">Backtest to paper</option>
              <option value="live_paper">Live paper evidence</option>
            </select>
          </label>
        </div>
        <div class="chart" id="paperChart"></div>
      </section>

      <section class="panel" id="livePanel" data-panel="live">
        <div class="toolbar">
          <label>
            <span>Gate</span>
            <select id="liveGate">
              <option value="paper_to_live">Paper to live</option>
            </select>
          </label>
        </div>
        <div class="chart" id="liveChart"></div>
      </section>
    </main>

    <script src="app.js?v=20260615-03"></script>
  </body>
</html>
